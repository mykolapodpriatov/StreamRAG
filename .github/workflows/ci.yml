name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff==0.14.14
      - name: Ruff lint
        run: ruff check .
      - name: Byte-compile sources
        run: python -m compileall -q .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal test dependencies
        # Deliberately NOT `-r requirements.txt`: worker.py only imports
        # celery, feedparser, qdrant-client, and langchain-openai at module
        # scope (langchain proper, ragas, and streamlit are unused by it), so
        # the test suite runs without pulling those heavier extras. The
        # Qdrant/embeddings tests mock qdrant-client and OpenAIEmbeddings, so
        # no live network or API key is required either.
        run: pip install pytest feedparser celery redis qdrant-client langchain-openai
      - name: Run tests
        run: pytest -q
